[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lfconv"
version = "0.1.0.dev0"
description = "Convert files locally: no uploads, no accounts, no telemetry."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lfconv = "lfconv.cli.main:main"

[project.gui-scripts]
lfconv-gui = "lfconv.gui:main"

[project.optional-dependencies]
image = ["Pillow>=10.1"]
dev = ["pytest>=7", "pypdf>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]
